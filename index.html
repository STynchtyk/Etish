<!doctype html>
<html lang="ky">

<head>
    <meta charset="UTF-8">

    <title>Этиштин өзгөчө формалары — Кыргыз тили</title>

    <meta
        name="description"
        content="Атоочтук, чакчыл жана кыймыл атооч жөнүндө мисалдар менен слайд-сабак."
    >
<meta name="google-site-verification" content="8YdfnwzynKwtR7YVPo2GmZMZ6wCS6dL3zG-gleVaAgc" />

    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <a class="brand" href="#1">
            <span class="logo">Э</span>
            Кыргыз тили
            <span class="sep">/</span>
            Морфология
        </a>

        <button id="full" aria-label="Толук экранга өтүү">
            ⛶ <span>Толук экран</span>
        </button>
    </header>

    <main id="deck" aria-live="polite"></main>

    <footer>
        <div class="counter">
            <b id="number">01</b>
            <span>/ 08</span>
        </div>

        <nav id="dots" aria-label="Слайддарды тандоо"></nav>

        <div class="controls">
            <button id="prev" aria-label="Мурунку слайд">
                ←
            </button>

            <button id="next">
                Кийинки <span>→</span>
            </button>
        </div>
    </footer>

    <div class="progress">
        <div id="progress"></div>
    </div>

    <script src="app.js"></script>

</body>
</html>
