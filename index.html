<html lang="ky"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Этиштин өзгөчө формалары — Кыргыз тили</title><meta name="description" content="Атоочтук, чакчыл жана кыймыл атооч жөнүндө мисалдар менен слайд-сабак."><style>
:root{font-family:'Noto Sans',Arial,sans-serif;color:#173b32;background:#f2f5f0;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #b07327;outline-offset:5px}header{height:92px;padding:0 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d8e1d9}.brand{display:flex;align-items:center;gap:13px;font-size:14px;text-decoration:none;color:inherit;font-weight:600}.logo{display:grid;place-items:center;width:36px;height:36px;background:#165d4a;color:#d9ef91;border-radius:10px;font:600 27px 'Noto Serif',serif}.sep{color:#a1b3a7;margin:0 5px}header button{border:0;background:transparent;color:#365849;font-size:14px}header button:first-letter{font-size:24px}main{min-height:calc(100svh - 196px);display:flex;align-items:center;padding:42px 8% 46px}.slide{width:100%;max-width:1280px;margin:auto;animation:appear .35s ease}.eyebrow{font-size:13px;letter-spacing:.14em;font-weight:700;text-transform:uppercase;display:flex;align-items:center;gap:12px;margin-bottom:28px}.eyebrow:before{content:'';width:28px;height:2px;background:#688b55}h1,h2{font-family:'Noto Serif',Georgia,serif;font-weight:500;letter-spacing:-.035em;line-height:1.16;margin:0 0 24px}h1{font-size:clamp(44px,5.7vw,82px)}h2{font-size:clamp(34px,4vw,58px)}h3{font-size:23px;margin:0 0 14px}p{font-size:19px;line-height:1.7;margin:0 0 22px;color:#52665c}.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:7%;align-items:center}.lead{max-width:510px}.tag{font-size:13px;border:1px solid #c6d5c7;padding:8px 13px;border-radius:30px;display:inline-block;margin-top:16px}.diagram{background:#145c49;color:white;padding:34px;border-radius:28px;position:relative;box-shadow:0 22px 55px #184b3212}.diagram-label{color:#aecbbc;letter-spacing:.13em;font-size:12px}.root{font:500 62px 'Noto Serif',serif;color:#e1f5a6;padding:12px 0 23px;border-bottom:1px solid #ffffff30}.branch{padding:20px 0 0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}.branch strong{font:400 28px 'Noto Serif',serif}.branch span{font-size:13px;color:#c8dfd3}.branch em{font-style:normal;color:#dcf49d}.intro{max-width:850px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:35px}.card{border:1px solid #d6e1d6;border-radius:18px;padding:25px;background:#fff9}.card small{font-size:13px;color:#708577;display:block;margin-bottom:25px}.card p{font-size:17px;margin:0}.word{display:block;font:500 32px 'Noto Serif',serif;margin:18px 0;color:#145c49}.two{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:start}.example{background:#145c49;color:#fff;border-radius:22px;padding:34px}.example p{color:#d3e5dc;font-size:17px}.example blockquote{font:400 32px/1.6 'Noto Serif',serif;margin:20px 0}.example mark{background:none;color:#d8f393;border-bottom:2px solid #d8f393}.suffixes{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}.suffixes span{padding:9px 16px;background:#e1eadf;border-radius:8px;font-size:18px}.note{font-size:15px;color:#728074}.table-wrap{overflow-x:auto;margin-top:26px}table{width:100%;border-collapse:collapse;font-size:18px;text-align:left}th{font-size:14px;color:#6b7e71;font-weight:500}td,th{padding:20px 16px;border-bottom:1px solid #d5dfd3}td:first-child{font-weight:600}td em{font-style:normal;color:#14604a;font-weight:700}.exercise{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}.exercise button{border:1px solid #bfd0c1;border-radius:12px;padding:16px 23px;background:#fff;color:#214e3e}.exercise button.correct{background:#145c49;color:#fff}.exercise button.wrong{background:#fae9dd;border-color:#be7750}.feedback{margin-top:22px;min-height:60px;font-size:17px}.sources{font-size:14px;margin-top:30px;line-height:1.8}.sources a{color:#416d52;text-underline-offset:4px}footer{height:104px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #d8e1d9}.counter{display:flex;gap:12px;align-items:center}.counter b{font-size:25px;font-weight:500}.counter span{font-size:14px;color:#87968a}#dots{display:flex;gap:9px}#dots button{border:0;width:26px;height:28px;background:transparent;padding:8px 4px}#dots button:after{content:'';display:block;background:#c5d3c5;height:5px;border-radius:10px}#dots button.active:after{background:#1a614a}.controls{display:flex;gap:12px}.controls button{height:46px;border-radius:9px;border:1px solid #c7d6c8;background:transparent;padding:0 18px;color:#24533f}.controls #next{background:#d7ed9b;border-color:#d7ed9b;min-width:142px;display:flex;align-items:center;justify-content:space-between;gap:20px}.controls button:disabled{opacity:.35;cursor:default}.progress{height:3px;background:#e0e8db}.progress div{height:100%;background:#226c4d;transition:width .3s}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(min-width:1500px){main{padding-top:65px;padding-bottom:65px}}@media(max-width:760px){header{height:72px;padding:0 6%}header button span,.sep{display:none}.brand{font-size:12px;gap:8px}main{padding:32px 7%;min-height:calc(100svh - 165px)}.hero,.two{grid-template-columns:1fr;gap:28px}.hero h1{font-size:44px}.diagram{padding:24px}.root{font-size:42px}.branch strong{font-size:23px}.branch{padding-top:15px}.eyebrow{margin-bottom:20px;font-size:12px}.cards{grid-template-columns:1fr;gap:12px}.card{padding:20px}.card small{margin-bottom:10px}.word{font-size:26px;margin:10px 0}.example{padding:25px}.example blockquote{font-size:26px}p{font-size:17px}footer{height:90px;padding:0 6%}#dots{gap:0}#dots button{width:15px;padding:8px 3px}.controls{gap:6px}.controls button{padding:0 13px}.controls #next{min-width:95px;font-size:13px;gap:10px}.counter{gap:5px}.counter b{font-size:21px}td,th{padding:15px 10px;font-size:15px}}@media(prefers-reduced-motion:reduce){.slide{animation:none}.progress div{transition:none}}
</style></head><body>
<header><a class="brand" href="#1"><span class="logo">Э</span> Кыргыз тили <span class="sep">/</span> Морфология</a><button id="full" aria-label="Толук экранга өтүү">⛶ <span>Толук экран</span></button></header>
<main id="deck" aria-live="polite"></main>
<footer><div class="counter"><b id="number">01</b><span>/ 08</span></div><nav id="dots" aria-label="Слайддарды тандоо"></nav><div class="controls"><button id="prev" aria-label="Мурунку слайд">←</button><button id="next">Кийинки <span>→</span></button></div></footer><div class="progress"><div id="progress"></div></div>
<script>const slides=[
{name:'Киришүү',html:`<div class="hero"><div><div class="eyebrow">Кыргыз тили · Слайд-сабак</div><h1>Этиштин<br>өзгөчө<br>формалары</h1><p class="lead">Бир кыймыл — үч башка кызмат.<br>Атоочтук, чакчыл жана кыймыл атооч менен таанышабыз.</p><span class="tag">8 слайд · Эрежелер жана мисалдар</span></div><div class="diagram"><div class="diagram-label">БИР УҢГУДАН</div><div class="root">оку<span style="color:#8caf98">—</span></div><div class="branch"><strong>оку<em>ган</em></strong><span>Атоочтук</span></div><div class="branch"><strong>оку<em>п</em></strong><span>Чакчыл</span></div><div class="branch"><strong>ок<em>уу</em></strong><span>Кыймыл атооч</span></div></div></div>`},
{name:'Үч форма',html:`<div class="eyebrow">01 · Негизги түшүнүк</div><h2>Эмне үчүн «өзгөчө»?</h2><p class="intro">Бул формалар этиштен жасалат, бирок башка сөз түркүмдөрүнө мүнөздүү белгилерге да ээ болот.</p><div class="cards"><div class="card"><small>01 / БЕЛГИ</small><h3>Атоочтук</h3><p>Кыймылды заттын белгиси катары көрсөтөт.</p><span class="word">келген конок</span><p>Кандай конок?</p></div><div class="card"><small>02 / КОШУМЧА КЫЙМЫЛ</small><h3>Чакчыл</h3><p>Негизги кыймылдын аткарылышын кошумчалайт.</p><span class="word">күлүп сүйлөдү</span><p>Кантип сүйлөдү?</p></div><div class="card"><small>03 / КЫЙМЫЛДЫН АТЫ</small><h3>Кыймыл атооч</h3><p>Кыймыл-аракеттин атын билдирет.</p><span class="word">китеп окуу</span><p>Эмне?</p></div></div>`},
{name:'Атоочтук',html:`<div class="eyebrow">02 · Атоочтук</div><div class="two"><div><h2>Кыймыл аркылуу<br>заттын белгиси</h2><p>Атоочтук заттын кандай экенин анын кыймылы аркылуу түшүндүрөт. Сын атоочко окшоп, затты аныктай алат.</p><h3>Көп колдонулган мүчөлөр</h3><div class="suffixes"><span>-ган</span><span>-ар</span><span>-бас</span><span>-уучу</span></div><p class="note">Мүчөлөр үндөшүү мыйзамына жараша өзгөрөт: келген, барган, өткөн.</p></div><div class="example"><small>СҮЙЛӨМДӨ КАРАП КӨРӨЛҮ</small><blockquote><mark>Келген</mark> конок<br>төргө отурду.</blockquote><p>Кандай конок? → келген конок.</p><p>«Келген» сөзү коноктун белгисин анын жасаган кыймылы аркылуу билдирип турат.</p></div></div>`},
{name:'Чакчыл',html:`<div class="eyebrow">03 · Чакчыл</div><div class="two"><div><h2>Негизги кыймылга<br>кошумча маани</h2><p>Чакчыл негизги кыймылдын кандайча, качан же кандай шартта аткарыларын билдирет.</p><h3>Көп колдонулган мүчөлөр</h3><div class="suffixes"><span>-ып</span><span>-а, -е, -й</span><span>-ганча</span><span>-майынча</span></div><p class="note">Мисалдар: жазып, сүйлөй, келгенче, бүтмөйүнчө.</p></div><div class="example"><small>СҮЙЛӨМДӨ КАРАП КӨРӨЛҮ</small><blockquote>Ал <mark>күлүп</mark><br>сүйлөдү.</blockquote><p>Кантип сүйлөдү? → күлүп.</p><p>Негизги кыймыл — «сүйлөдү». «Күлүп» ошол кыймылдын кандайча аткарылганын көрсөтөт.</p></div></div>`},
{name:'Кыймыл атооч',html:`<div class="eyebrow">04 · Кыймыл атооч</div><div class="two"><div><h2>Кыймылдын<br>атын атайбыз</h2><p>Кыймыл атооч аракетти атайт. Ал зат атооч сыяктуу жөндөлүп, таандык мүчөлөрдү кабыл ала алат.</p><h3>Мүчөлөрдүн мисалдары</h3><div class="suffixes"><span>-уу, -үү</span><span>-оо, -өө</span><span>-ыш, -иш</span><span>-мак, -мек</span></div><p class="note">Окуу → окуунун → окууга.<br>Жазуу → жазуум.</p></div><div class="example"><small>СҮЙЛӨМДӨ КАРАП КӨРӨЛҮ</small><blockquote><mark>Окуу</mark> —<br>пайдалуу иш.</blockquote><p>Эмне пайдалуу иш? → окуу.</p><p>Бул жерде «окуу» кыймылдын атын билдирип, сүйлөмдө ээнин милдетин аткарды.</p></div></div>`},
{name:'Салыштыруу',html:`<div class="eyebrow">05 · Салыштыруу</div><h2>Уңгу бир, кызматы башка.</h2><p>«Жаз» этишин үч түрдүү формада колдонуп көрөлү.</p><div class="table-wrap"><table><thead><tr><th>Форма</th><th>Мисал</th><th>Эмнени билдирет?</th></tr></thead><tbody><tr><td>Атоочтук</td><td><em>Жазган</em> окуучу</td><td>Окуучунун белгисин</td></tr><tr><td>Чакчыл</td><td><em>Жазып</em> отурду</td><td>Негизги кыймылга кошумча кыймылды</td></tr><tr><td>Кыймыл атооч</td><td><em>Жазуу</em> — өнөр</td><td>Кыймылдын атын</td></tr></tbody></table></div><p class="note" style="margin-top:25px">Форманы аныктоодо мүчөсүнө гана эмес, сүйлөмдөгү маанисине жана кызматына да көңүл бур.</p>`},
{name:'Көнүгүү',html:`<div class="eyebrow">06 · Өзүңдү текшер</div><h2>«Шашып» — кайсы форма?</h2><div class="example" style="max-width:780px;margin-top:28px"><blockquote style="margin:0">Анара мектепке <mark>шашып</mark> барды.</blockquote></div><div class="exercise"><button data-answer="no">Атоочтук</button><button data-answer="yes">Чакчыл</button><button data-answer="no">Кыймыл атооч</button></div><p class="feedback" id="feedback" role="status">Туура жоопту танда.</p>`},
{name:'Жыйынтык',html:`<div class="eyebrow">07 · Жыйынтык</div><h2>Үч суроо менен эсте сакта.</h2><div class="cards"><div class="card"><small>АТООЧТУК</small><h3>Кандай?</h3><span class="word">өскөн дарак</span><p>Заттын белгисин көрсөтөт.</p></div><div class="card"><small>ЧАКЧЫЛ</small><h3>Кантип?</h3><span class="word">шашып келди</span><p>Кыймылды кошумчалайт.</p></div><div class="card"><small>КЫЙМЫЛ АТООЧ</small><h3>Эмне?</h3><span class="word">билим алуу</span><p>Кыймылдын атын билдирет.</p></div></div><p class="note" style="margin-top:25px">Бул суроолор мисалдарды эстөөгө жардам берет; ар бир форманын сүйлөмдөгү кызматы кеңири болушу мүмкүн.</p><div class="sources">Булактар: <a href="https://orfo.el-sozduk.kg/грамматика/pb/" target="_blank" rel="noopener">Эл-Сөздүк · Этиштин өзгөчө формалары</a> · <a href="https://encyclopedia.edu.kg/KyrgWiki/index.php?title=АТООЧТУК" target="_blank" rel="noopener">Кыргыз энциклопедиясы · Атоочтук</a></div>`}
];
let current=0;const deck=document.getElementById('deck'),dots=document.getElementById('dots');
slides.forEach((s,i)=>{const b=document.createElement('button');b.setAttribute('aria-label',`${i+1}. ${s.name}`);b.title=s.name;b.onclick=()=>go(i);dots.append(b)});
function go(i){current=Math.max(0,Math.min(slides.length-1,i));deck.innerHTML=`<section class="slide" aria-label="${slides[current].name}">${slides[current].html}</section>`;document.getElementById('number').textContent=String(current+1).padStart(2,'0');document.getElementById('progress').style.width=`${(current+1)/slides.length*100}%`;document.getElementById('prev').disabled=current===0;document.getElementById('next').innerHTML=current===slides.length-1?'Башынан ↺':'Кийинки <span>→</span>';[...dots.children].forEach((b,j)=>{b.classList.toggle('active',j===current);b.setAttribute('aria-current',j===current?'step':'false')});try{history.replaceState(null,'',`#${current+1}`)}catch{};deck.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const ok=b.dataset.answer==='yes';b.classList.add(ok?'correct':'wrong');document.getElementById('feedback').textContent=ok?'Туура! «Шашып» — чакчыл. Кантип барды? — шашып. Ал -ып мүчөсү аркылуу жасалды.':'Дагы ойлонуп көр: «шашып» сөзү «кантип барды?» деген суроого жооп берет.'});}
document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current===slides.length-1?0:current+1);
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown','ArrowLeft','PageUp','Home','End'].includes(e.key)){e.preventDefault();go(e.key==='Home'?0:e.key==='End'?slides.length-1:current+(['ArrowRight','PageDown'].includes(e.key)?1:-1))}});
document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{document.getElementById('full').textContent='Толук экран жеткиликсиз'}};
let touchX=0,touchY=0;deck.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX;touchY=e.changedTouches[0].clientY},{passive:true});deck.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)go(current+(dx<0?1:-1))},{passive:true});
go((Number(location.hash.slice(1))||1)-1);
</script></body></html>
